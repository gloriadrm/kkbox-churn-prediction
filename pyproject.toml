
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kkbox-churn"
version = "0.1.0"
description = "KKBox customer churn prediction project"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0",
    "numpy>=2.0",
    "scikit-learn>=1.7,<1.8",
    "joblib>=1.5",
    "mlflow-skinny>=3.0",   # en lugar de "mlflow>=3.0"
    "skops",                # para cargar los modelos guardados en formato skops (necesario para mlflow)
    "python-dotenv>=1.0",
    "fastapi>=0.162.5",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.16.0",
    "jupyter",
    "matplotlib",
    "plotly",
    "pytest>=9.2.0",
    "mlflow>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
kkbox-churn = "kkbox_churn.cli:main"
