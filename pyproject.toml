
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kkbox-churn"
version = "0.1.0"
description = "KKBox customer churn prediction project"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0",
    "numpy>=2.0",
    "scikit-learn>=1.7,<1.8",
    "joblib>=1.5",
    "mlflow>=3.0",
    "python-dotenv>=1.0"
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "matplotlib",
    "plotly",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
kkbox-churn = "kkbox_churn.cli:main"